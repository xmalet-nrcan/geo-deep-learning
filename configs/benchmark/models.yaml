# =============================================================================
# Registre des modèles du benchmark predict (dev plan P5)
# Doc : configs/benchmark/README.md — validation :
#   python scripts/validate_benchmark_configs.py [--cli] [--load-weights]
#
# output_root : racine des sorties → <output_root>/<name>/<event_id>/<output_name>.tif
#               (surchargeable par BENCHMARK_OUTPUT_DIR côté orchestrateur)
# models[]    :
#   name        ^[A-Za-z0-9_.-]+$, unique — nom du dossier de sortie et de test_runs.model_name
#   config      config predict ; chemin relatif = relatif à CE fichier
#   enabled     false ⇒ ignoré par l'orchestrateur et la validation (sauf --include-disabled)
#   description optionnel
# =============================================================================
output_root: /mnt/geospatial/projet_RCM_scanfire/benchmark_outputs

models:
  - name: csfarseg_r50_v2_e76
    config: csfarseg_r50_v2_e76_predict.yaml
    enabled: true
    description: >-
      Modèle de production (référence) — ChangeStar(FarSeg) ResNet-50 + raffinement
      pleine résolution, beam A, 2023-2025, FiLM 8, CBAM, signed-diff, run v2,
      epoch 76 (val_iou 0.727). Inférence : buffer 100, tuiles 256 / pas 128.

  - name: cs2base_cosine_restarts_e24
    config: cs2base_cosine_restarts_e24_predict.yaml
    enabled: true
    description: >-
      Ancien modèle de production — ChangeStar2, beam A, 2023-2025,
      FiLM 8, CBAM, signed-diff, cosine restarts, epoch 24.
      Inférence : buffer 50, tuiles 256 / pas 256.


  - name: cs2base_cosine_restarts_v2
    config: cs2base_cosine_restarts_v2_predict.yaml
    enabled: true
    description: >-
      ChangeStar2, beam A, 2023-2025, FiLM 8, CBAM, signed-diff, 9 bandes,
      cosine restarts v2 (même découpage que farseg v2).
      Inférence alignée sur la prod : buffer 100, tuiles 256 / pas 128.

  - name: changeformer_v7_all9bands
    config: changeformer_v7_all9bands_predict.yaml
    enabled: true
    description: >-
      ChangeFormer v7, beam A, 2023-2025, FiLM 8, CBAM, signed-diff,
      9 bandes (ordre RR/RL avant NDSV/RFDI), cosine restarts T_0 30 / T_mult 2.
      Inférence alignée sur la prod : buffer 100, tuiles 256 / pas 128.
