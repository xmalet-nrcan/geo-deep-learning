# =============================================================================
# Benchmark predict config — cs2base_cosine_restarts_v2
# -----------------------------------------------------------------------------
# ChangeStar2, beam A, 2023+2025, FiLM 8, CBAM, signed-diff, cosine restarts v2.
# Entraînement : configs/rcm_change_detection_changestar2_cosine_restarts_v2.yaml
# (9 bandes, ordre de la prod farseg).
# Inférence alignée sur la prod (csfarseg_r50_v2_e76) : buffer 100, tuiles 256 / pas 128.
#
# Ne PAS renseigner ici les clés injectées par l'orchestrateur (README.md §Override).
# =============================================================================
seed_everything: true

trainer:
  accelerator: "gpu"
  devices: 1
  strategy: auto
  precision: "bf16-mixed"
  callbacks: []

model:
  class_path: tasks_with_models.change_detection_changeformer.ChangeDetectionChangeFormer
  init_args:
    # --- Architecture (identique à changestar2_cosine_restarts_v2) ---
    change_detection_model: "changestar2"
    image_size: [256, 256]
    max_samples: 10
    num_classes: 1
    deep_supervision: true

    use_metadata_film: true
    film_embed_dim: 8

    use_cbam: true
    cbam_reduction: 4

    use_channel_dropout: true
    channel_dropout_prob: 0.15

    use_dfa: false
    dfa_gate_hidden: 16

    use_signed_difference: true
    signed_difference_channels: null
    signed_difference_normalize: true

    # --- Requis par le constructeur, sans effet en predict ---
    speckle_noise_std: 0.15
    burned_class_weight: 2.0
    main_loss:
      class_path: segmentation_models_pytorch.losses.FocalLoss
      init_args:
        mode: "binary"
        gamma: 1.5
        ignore_index: 255
    secondary_loss:
      class_path: segmentation_models_pytorch.losses.LovaszLoss
      init_args:
        mode: "binary"
        ignore_index: 255
    loss_ratio: [0.6, 0.4]
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 3e-4
        weight_decay: 0.05
    scheduler:
      class_path: torch.optim.lr_scheduler.ConstantLR
    class_labels: ["unburn", "burn"]
    class_colors: ["#000000", "#FF0000"]
    weights_from_checkpoint_path: /app/models_checkpoints/2026/changestar2/tiled/new/cs2base_A_y23_25_water-film8-mchi_rrrl-cosine-restarts-tiled-v2-epoch=29-val_iou=0.703.ckpt

data:
  class_path: datamodules.rcm_change_detection_datamodule.RcmChangeDetectionDataModule
  init_args:
    # Placeholders — remplacés par l'override du benchmark (README.md §Override)
    csv_root_folder: __set_by_benchmark_override__
    csv_file_name: __set_by_benchmark_override__
    patches_root_folder: /mnt/geospatial/projet_RCM_scanfire/grided_folder
    batch_size: 8
    num_workers: 10
    separate_metadata: true
    patch_size: [256, 256]
    predict_overlap_buffer: 100      # train_overlap_buffer: 50 — aligné sur la prod
    tile_size: [256, 256]
    tile_stride: [128, 128]          # entraînement : 256 — aligné sur la prod
    band_names: ['LOCALINCANGLE', 'PDN', 'PSN', 'PVN', 'S0', 'NDSV', 'RFDI', 'RR', 'RL']
    # Filtres conservés tels quels (décision 5)
    beams:
      - 'A'
    satellite_pass:
    dataset_years:
