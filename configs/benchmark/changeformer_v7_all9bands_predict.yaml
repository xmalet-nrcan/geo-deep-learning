# =============================================================================
# Benchmark predict config — changeformer_v7_all9bands
# -----------------------------------------------------------------------------
# ChangeFormer v7, beam A, 2023+2025, FiLM 8, CBAM, signed-diff, cosine restarts
# (T_0 30, T_mult 2), 9 bandes.
# Entraînement : configs/rcm_change_detection_changeformer_all9bands.yaml
# ⚠ Ordre des bandes ≠ autres modèles (RR, RL avant NDSV, RFDI) : NE PAS réordonner.
# Inférence alignée sur la prod (csfarseg_r50_v2_e76) : buffer 100, tuiles 256 / pas 128.
#
# Ne PAS renseigner ici les clés injectées par l'orchestrateur (README.md §Override).
# =============================================================================
seed_everything: true

trainer:
  accelerator: "gpu"
  devices: 1
  strategy: auto
  precision: "bf16-mixed"
  callbacks: []

model:
  class_path: tasks_with_models.change_detection_changeformer.ChangeDetectionChangeFormer
  init_args:
    # --- Architecture (identique à changeformer_all9bands) ---
    change_detection_model: "changeformer_7"
    image_size: [256, 256]
    max_samples: 10
    num_classes: 1
    deep_supervision: true

    use_metadata_film: true
    film_embed_dim: 8

    use_cbam: true
    cbam_reduction: 4

    use_channel_dropout: true
    channel_dropout_prob: 0.3

    use_dfa: false
    dfa_gate_hidden: 16

    use_signed_difference: true
    signed_difference_channels: null
    signed_difference_normalize: true

    # --- Requis par le constructeur, sans effet en predict ---
    speckle_noise_std: 0.15
    burned_class_weight: 3.0
    main_loss:
      class_path: segmentation_models_pytorch.losses.FocalLoss
      init_args:
        mode: "binary"
        gamma: 1.5
        ignore_index: 255
    secondary_loss:
      class_path: segmentation_models_pytorch.losses.LovaszLoss
      init_args:
        mode: "binary"
        ignore_index: 255
    loss_ratio: [0.6, 0.4]
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 5e-4
        weight_decay: 0.05
    scheduler:
      class_path: torch.optim.lr_scheduler.ConstantLR
    class_labels: ["unburn", "burn"]
    class_colors: ["#000000", "#FF0000"]
    weights_from_checkpoint_path: /app/models_checkpoints/2026/changeformer7/tiled/bands_all9/cf7_A_y23-25_cosine-restarts-tiled-bands-all9-epoch=49-val_loss=0.481.ckpt

data:
  class_path: datamodules.rcm_change_detection_datamodule.RcmChangeDetectionDataModule
  init_args:
    # Placeholders — remplacés par l'override du benchmark (README.md §Override)
    csv_root_folder: __set_by_benchmark_override__
    csv_file_name: __set_by_benchmark_override__
    patches_root_folder: /mnt/geospatial/projet_RCM_scanfire/grided_folder
    batch_size: 8
    num_workers: 10
    separate_metadata: true
    patch_size: [256, 256]
    predict_overlap_buffer: 100      # train_overlap_buffer: 50 — aligné sur la prod
    tile_size: [256, 256]
    tile_stride: [128, 128]          # entraînement : 256 — aligné sur la prod
    band_names: ['LOCALINCANGLE', 'PDN', 'PSN', 'PVN', 'S0', 'RR', 'RL', 'NDSV', 'RFDI']
    # Filtres conservés tels quels (décision 5)
    beams:
      - 'A'
    satellite_pass:
    dataset_years:
