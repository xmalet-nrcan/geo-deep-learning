seed_everything: true


trainer:
#  detect_anomaly: true
  accelerator: "gpu"
  devices: -1
  strategy: auto

  gradient_clip_val: 1.0
  precision: "32-true"
  sync_batchnorm: true
  gradient_clip_algorithm: "norm"
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: &log_dir ./lightning_logs

      name: &run_name 2026_2_A_mask_water_10pct_changeformer_focal-lovasz_fire_id_cosinewarm_mchi_rr_rl
#  logger:
#    class_path: lightning.pytorch.loggers.mlflow.MLFlowLogger
#    init_args:
#      save_dir: .mlflow/logs
#      log_model: all
#      experiment_name: "change_detection_AB_2"
#      run_name: "segformer_rcm_change_detection"
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val_loss"
        mode: "min"
        verbose: True
        patience: 30
        min_delta: 1e-3
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: &checkpoint_dir ./model_checkpoints
        monitor: "val_loss"
        mode: "min"
        save_top_k: 5
        filename: "${trainer.logger.init_args.name}-{epoch:02d}-{val_loss:.3f}"
    - class_path: tools.callbacks.segmentation_visualization.VisualizationCallback
      init_args:
        max_samples: 50
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "epoch"
#    - class_path: lightning.pytorch.callbacks.RichProgressBar

    - class_path: lightning.pytorch.callbacks.StochasticWeightAveraging
      init_args:
        swa_lrs: 1e-3
        annealing_epochs: 10
        swa_epoch_start: 0.75
    - class_path: lightning.pytorch.callbacks.GradientAccumulationScheduler
      init_args:
        scheduling:
          0: 16    # 16*8 = 128 effective batch size at start
          50: 8    # to epoch 20, accumule 8 batchs 16*8 = 128 effective batch size
          100: 4    # to epoch 40, accumule 4 batchs 16*4 = 64 effective batch size
          150: 2    # to epoch 50, accumule 2 batchs 16*2 = 32 effective batch size
          175: 1    # then normal training with 16 batch size
  max_epochs: 240
  check_val_every_n_epoch: 1

model:
  class_path: tasks_with_models.change_detection_changeformer.ChangeDetectionChangeFormer
  init_args:
    change_detection_model: "changeformer"
    image_size: [256,256]
    # set to; it will be set to the number of band_names in the datamodule +
    # 1 for COMMON MASK
    # 1 for BITMASK
    # 1 for SAT_PASS encoding
    # 1 for BEAM encoding
    in_channels: 11 # Should be the length of data.band_names + 4
    max_samples: 20
    num_classes: 1  # binary change detection
    burned_class_weight: 3.0  # >1 penalizes false negatives on class burn (1)

    main_loss:
      #class_path: segmentation_models_pytorch.losses.SoftBCEWithLogitsLoss
      class_path: segmentation_models_pytorch.losses.FocalLoss
      init_args:
        mode: "binary"
        alpha: 0.75
        gamma: 2.0
        # smooth_factor: 0.05
    secondary_loss:
      #class_path: segmentation_models_pytorch.losses.FocalLoss
      class_path: segmentation_models_pytorch.losses.LovaszLoss
      init_args:
        mode: "binary"
        #smooth: 0.05
        #gamma: 2.0
        #normalized: 1
        #alpha: 0.25
    loss_ratio:
      - 0.6  # weight for the main_loss
      - 0.4  # weight for the secondary_loss
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 1e-5
        weight_decay: 0.01
        betas:
        - 0.9
        - 0.999
    #    scheduler:
#      class_path: torch.optim.lr_scheduler.OneCycleLR
#      init_args:
#        max_lr: 1e-4
#        total_steps: 53100    # fallback si estimated_stepping_batches == -1
#        pct_start: 0.1
#        anneal_strategy: "cos"
#        div_factor: 10
#        final_div_factor: 100
#    scheduler_config:
#      interval: "step"
#      frequency: 1
    scheduler:
      class_path: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
      init_args:
        #        T_max: 150
        T_0: 20
        T_mult: 2
        eta_min: 1e-6
    scheduler_config:
      interval: "epoch"
      frequency: 1

    class_labels: [ "unburn", "burn" ]
    class_colors: [ "#000000", "#FF0000" ]
    #weights_from_checkpoint_path: /app/model_checkpoints/2026_changeformer_focal-jaccard_fire_id_cosinewarm_mchi_rr_rl-epoch=56-val_loss=0.273.ckpt

data:
  class_path: datamodules.rcm_change_detection_datamodule.RcmChangeDetectionDataModule
  init_args:
    batch_size: 8
    num_workers: 10
    data_type_max: 1
    patch_size:
    - 256
    - 256
    split_on_columns: db_nbac_fire_id
    csv_root_folder: &data_root /mnt/geospatial/projet_RCM_scanfire/
    patches_root_folder: /mnt/geospatial/projet_RCM_scanfire/grided_folder
    #csv_file_name: pre_post_datasets_all_2023_2025.csv
    csv_file_name: tbl_input_pre_post_data.csv
    #csv_file_name:  pre_post_datasets_all.csv
    #csv_file_name: pre_post_datasets.csv
    split_ratios: [0.8 ,0.1, 0.1]

    #band_names: [ 'LOCALINCANGLE', 'RL','RR' ] # RCM INPUT (non-polarimetric intensity)
    band_names: [ 'LOCALINCANGLE', 'PDN','PSN','PVN', 'S0', 'RL','RR' ] # MCHI-DECOMP ==> 5 bands
    # band_names: null # All Bands
    # band_names: [ 'M','RL','RR','S0','SP1','SP2','LOCALINCANGLE' ]
    # RCM bands AVAILABLE
    # -------------------
    #    BITMASK_CROPPED
    #    LOCALINCANGLE
    #    M
    #    NDSV     # strongly correlated with PVN
    #    PDN
    #    PSN
    #    PVN
    #    RFDI     #
    #    RL
    #    RR
    #    S0
    #    SP1
    #    SP2
    #    SP3

    beams: # AVAILABLE: ['A','B','C','D']
    - 'A'
    #- 'B'
    #- 'C'
    satellite_pass:   # AVAILABLE: ['Ascending','Descending']