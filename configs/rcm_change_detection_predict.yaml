seed_everything: true

trainer:
  accelerator: "gpu"
  devices: 1                  # predict ne supporte qu'un seul device
  strategy: auto
  precision: "bf16-mixed"     # cohérent avec le training; RTX 6000 Ada OK
#  logger:
#    class_path: lightning.pytorch.loggers.TensorBoardLogger
#    init_args:
#      save_dir: &log_dir ./lightning_logs
#      name: &run_name predict/changestar/2026/changestar2_2026
  # Pas de callbacks de training (pas d'EarlyStopping, ModelCheckpoint, etc.)
  callbacks: []

model:
  class_path: tasks_with_models.change_detection_changeformer.ChangeDetectionChangeFormer
  init_args:
    change_detection_model: "changestar2"
    image_size: [256, 256]
    in_channels: 10           # 9 band_names + 1 BITMASK_CROPPED (FiLM mode)
    max_samples: 10
    num_classes: 1
    burned_class_weight: 5.0  # >1 penalizes false negatives on class burn (1)

    speckle_noise_std: 0.15  # SAR-specific multiplicative speckle augmentation
    # --- Conditioning & regularization modules ---
    use_metadata_film: true       # encode SAT_PASS/BEAM via FiLM instead of constant bands
    film_embed_dim: 8            # embedding dimension for FiLM conditioner

    use_cbam: true               # Disabled: ConvNeXt encoder already has implicit channel attention
    cbam_reduction: 4

    use_channel_dropout: true     # Drop aléatoire de bandes SAR (train only) — always useful
    channel_dropout_prob: 0.3     # prob de drop par canal (0.1 = conservateur)

    use_dfa: false                # Disabled: ChangeStar2 aux heads are too simple for gating
    dfa_gate_hidden: 16
    # Les losses sont requises par le constructeur, même si elles ne servent pas en predict
    main_loss:
      class_path: segmentation_models_pytorch.losses.FocalLoss
      init_args:
        mode: "binary"
        gamma: 1.5
        ignore_index: 255
    secondary_loss:
      class_path: segmentation_models_pytorch.losses.LovaszLoss
      init_args:
        mode: "binary"
        ignore_index: 255
    loss_ratio:
      - 0.6
      - 0.4
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 1e-5              # base lr (OneCycleLR ramps to max_lr)
        weight_decay: 0.01
        betas:
          - 0.9
          - 0.999
    scheduler:
      class_path: torch.optim.lr_scheduler.OneCycleLR
      init_args:
        max_lr: 1e-4          # peak lr (reduced from 6e-4)
        pct_start: 0.1        # 30% warmup, 70% cosine decay
        anneal_strategy: cos
        div_factor: 10        # initial lr = 3e-4 / 6 = 5e-5
        final_div_factor: 100 # final lr ≈ 5e-7
        total_steps: null     # auto-computed by Lightning
        cycle_momentum: false

    scheduler_config:
      interval: "step"        # OneCycleLR MUST step per batch, not per epoch
      frequency: 1
    class_labels: ["unburn", "burn"]
    class_colors: ["#000000", "#FF0000"]
    weights_from_checkpoint_path: /app/models_checkpoints/2026/changestar2/cs2base_A_y23-25_8film-cbam-only-no-swa-epoch=94-val_loss=0.215.ckpt
    predict_output_dir: /mnt/geospatial/projet_RCM_scanfire/grided_folder/predictions

data:
  class_path: datamodules.rcm_change_detection_datamodule.RcmChangeDetectionDataModule
  init_args:
    dataset_class: datasets.rcm_change_detection_predict_dataset.RCMChangeDetectionOnPredictDataset
    batch_size: 8
    num_workers: 10
    separate_metadata: true   # SAT_PASS/BEAM as scalars for FiLM (must match training)
    patch_size: [256, 256]
    # --- Overlap between grid cells ---
    # Loads extra pixels from each neighboring cell on every side.
    # For 200×200 cells with buffer=50, the expanded image is 300×300.
    # Adjacent cells overlap by 2×50 = 100px = 50% of cell size.
    predict_overlap_buffer: 50
    # Tiling with overlap: if the expanded image (e.g. 400×400) is larger
    # than image_size, enable tiling. Set to null to disable.
    tile_size: [256, 256]
    tile_stride: [192, 192]       # overlap = tile_size - stride = 64 px per side
    csv_root_folder:  &data_root /mnt/geospatial/projet_RCM_scanfire/grided_folder/predictions
    patches_root_folder: /mnt/geospatial/projet_RCM_scanfire/grided_folder
    csv_file_name: vw_input_files_for_change_detection.csv
    band_names: [ 'LOCALINCANGLE', 'PDN','PSN','PVN', 'S0' , 'NDSV','RFDI', 'RR','RL']
    beams:
      - 'A'
    satellite_pass:  # null = pas de filtre
    dataset_years:
