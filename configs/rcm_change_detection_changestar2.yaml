seed_everything: true

.vars:
  model_name: &model_name "changestar2"
  log_dir: &log_dir ./lightning_logs
  model_dir: &model_dir ./model_checkpoints/2026/changestar2
  data_dir: &data_dir /mnt/geospatial/projet_RCM_scanfire/
  patches_dir: &patches_dir /mnt/geospatial/projet_RCM_scanfire/grided_folder
  run_name: &run_name 2026/changestar2/cs2base_A_y23-25_water_film-chdrop_focal-lovasz_1cycle

trainer:
#  detect_anomaly: true
  accelerator: "gpu"
  devices: -1
  strategy: auto

  gradient_clip_val: 1.0
  precision: "bf16-mixed"  # bf16: no GradScaler needed, no overflow (same exponent as fp32)
  sync_batchnorm: true
  gradient_clip_algorithm: "norm"
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: *log_dir
      name: *run_name

  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val_loss"
        mode: "min"
        verbose: True
        patience: 50
        min_delta: 1e-3
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: *model_dir
        monitor: "val_loss"
        mode: "min"
        save_top_k: 5
        filename: "cs2base_A_y23-25-{epoch:02d}-{val_loss:.3f}"
    - class_path: tools.callbacks.segmentation_visualization.VisualizationCallback
      init_args:
        max_samples: 50
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "epoch"

    - class_path: lightning.pytorch.callbacks.StochasticWeightAveraging
      init_args:
        swa_lrs: 5e-5         # must be ≤ base lr (1e-4) for AdamW; 1e-3 was 10× too high
        annealing_epochs: 10
        swa_epoch_start: 0.75
    - class_path: lightning.pytorch.callbacks.GradientAccumulationScheduler
      init_args:
        scheduling:
          0: 4      # epochs 0-19:   8×8 = 64 effective batch size (smooth start)

  max_epochs: 240
  check_val_every_n_epoch: 1

model:
  class_path: tasks_with_models.change_detection_changeformer.ChangeDetectionChangeFormer
  init_args:
    change_detection_model: *model_name
    image_size: [256,256]
    # set to the number of band_names in the datamodule + 1 for BITMASK_CROPPED (always loaded)
    # With separate_metadata=true, COMMON_MASK / SAT_PASS / BEAM are NOT
    # counted as image channels — they use FiLM conditioning instead.
    in_channels: 10 # len(band_names) + 1 (BITMASK_CROPPED)
    max_samples: 50
    num_classes: 1  # binary change detection
    burned_class_weight: 5.0  # >1 penalizes false negatives on class burn (1)
    deep_supervision: true  # use all ChangeFormer decoder heads for loss
    # deep_supervision_weights: [0.1, 0.1, 0.15, 0.2, 1.0]  # per-head weights (c4→c1→final)
    speckle_noise_std: 0.15  # SAR-specific multiplicative speckle augmentation
    # --- Conditioning & regularization modules ---
    use_metadata_film: true       # encode SAT_PASS/BEAM via FiLM instead of constant bands
    film_embed_dim: 32            # embedding dimension for FiLM conditioner

    use_cbam: false               # Disabled: ConvNeXt encoder already has implicit channel attention
    cbam_reduction: 4

    use_channel_dropout: true     # Drop aléatoire de bandes SAR (train only) — always useful
    channel_dropout_prob: 0.1     # prob de drop par canal (0.1 = conservateur)

    use_dfa: false                # Disabled: ChangeStar2 aux heads are too simple for gating
    dfa_gate_hidden: 16


    main_loss:
      class_path: segmentation_models_pytorch.losses.FocalLoss
      init_args:
        mode: "binary"
        gamma: 1.5
        ignore_index: 255
    secondary_loss:
      class_path: segmentation_models_pytorch.losses.LovaszLoss
      init_args:
        mode: "binary"
        ignore_index: 255
    loss_ratio:
      - 0.6  # weight for the main_loss
      - 0.4  # weight for the secondary_loss
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 1e-4              # base lr (OneCycleLR uses this as initial, ramps to max_lr)
        weight_decay: 0.01
        betas:
        - 0.9
        - 0.999
    scheduler:
      class_path: torch.optim.lr_scheduler.OneCycleLR
      init_args:
        max_lr: 6e-4          # peak lr (~6× base lr is a good default)
        pct_start: 0.3        # 30% warmup, 70% cosine decay
        anneal_strategy: cos  # cosine annealing (smoother than linear)
        div_factor: 6         # initial lr = max_lr / div_factor = 6e-4 / 6 = 1e-4
        final_div_factor: 100 # final lr = max_lr / (div_factor × final_div_factor) ≈ 1e-6
        total_steps: null     # auto-computed by Lightning from trainer config

    scheduler_config:
      interval: "step"        # OneCycleLR MUST step per batch, not per epoch
      frequency: 1

    class_labels: [ "unburn", "burn" ]
    class_colors: [ "#000000", "#FF0000" ]
    #weights_from_checkpoint_path: /app/model_checkpoints/2026_8_A_2023_2025_mask_water_rel_orbs_changeformer7_focal-lovasz_fire_id_cosw_all_attention-epoch=49-val_loss=0.248.ckpt

data:
  class_path: datamodules.rcm_change_detection_datamodule.RcmChangeDetectionDataModule
  init_args:
    batch_size: 8
    num_workers: 10
    separate_metadata: true  # SAT_PASS/BEAM as scalars, not image bands
    patch_size:
    - 256
    - 256
    split_on_columns: db_nbac_fire_id
    csv_root_folder: *data_dir
    patches_root_folder: *patches_dir
    csv_file_name: tbl_input_pre_post_data.csv
    split_ratios: [0.8 ,0.1, 0.1]

    band_names: [ 'LOCALINCANGLE', 'PDN','PSN','PVN', 'S0' , 'NDSV','RFDI', 'RR','RL']

    beams:
    - 'A'
    satellite_pass:   # null = both Ascending + Descending
    dataset_years:
    - 2025
    - 2023