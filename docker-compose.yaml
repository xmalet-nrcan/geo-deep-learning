x-gpu-service: &gpu-defaults
  build:
    dockerfile: Dockerfile
  runtime: nvidia
  user: '9005'
  shm_size: '32gb'
  environment: &gpu-env
    - PYTORCH_ALLOC_CONF=expandable_segments:True
    - NVIDIA_VISIBLE_DEVICES=all
    - CUDA_LAUNCH_BLOCKING=1
    - TORCH_USE_CUDA_DSA=1
    - CLI_COMMAND=fit
  volumes: &train-volumes
    - "/mnt/geospatial/projet_RCM_scanfire:/mnt/geospatial/projet_RCM_scanfire:rw"
    - "./models_checkpoints:/app/models_checkpoints:rw"
    - "./lightning_logs:/app/lightning_logs:rw"
  entrypoint: &train-entrypoint >
    sh -c '
      echo "Running in mode $$CLI_COMMAND";
      export CMD="python /app/geo_deep_learning/train.py $$CLI_COMMAND --config /app/configs/model_conf.yaml";
      echo "Running: $$CMD";
      exec $$CMD;
    '
  deploy: &gpu-deploy
    resources:
      reservations:
        devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  # === Training: ChangeFormer (default) ===
  geo-deep-learning:
    <<: *gpu-defaults
    container_name: geo-deep-learning
    volumes:
      - "/mnt/geospatial/projet_RCM_scanfire:/mnt/geospatial/projet_RCM_scanfire:rw"
      # TRAIN_CONFIG lets scripts (e.g. scripts/run_band_sweep.sh) swap the active
      # config without editing this file; defaults to the usual prod config.
      - "${TRAIN_CONFIG:-/home/xmalet/projects/geo-deep-learning/configs/rcm_change_detection_changestar2_cosine_restarts.yaml}:/app/configs/model_conf.yaml"
      - "./models_checkpoints:/app/models_checkpoints:rw"
      - "./lightning_logs:/app/lightning_logs:rw"

  # === Training: ChangeStar2 ===
  geo-deep-learning-cs2:
    <<: *gpu-defaults
    container_name: geo-deep-learning-cs2
    volumes:
      - "/mnt/geospatial/projet_RCM_scanfire:/mnt/geospatial/projet_RCM_scanfire:rw"
      - "/home/xmalet/projects/geo-deep-learning/configs/rcm_change_detection_changestar2.yaml:/app/configs/model_conf.yaml"
      - "./models_checkpoints:/app/models_checkpoints:rw"
      - "./lightning_logs:/app/lightning_logs:rw"

  # === Event Detection Orchestrator ===
  event_detection_orchestrator:
    build:
      context: .
      dockerfile: orchestrator.Dockerfile
    runtime: nvidia
    shm_size: '32gb'
    container_name: event_detection_orchestrator
    restart: unless-stopped
    user: '9005'
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - POLL_INTERVAL_SECONDS=100
      - LOGGER_LEVEL=INFO
      - PREDICT_CONFIG=/app/configs/model_conf.yaml
    volumes:
      - "./configs/rcm_change_detection_predict.yaml:/app/configs/model_conf.yaml:ro"
      - "./models_checkpoints:/app/models_checkpoints:rw"
      #- "./lightning_logs:/app/lightning_logs:rw"
      - "../scanfire/scanfire_modules:/app/scanfire_modules:ro"
      - "/mnt/geospatial/projet_RCM_scanfire:/mnt/geospatial/projet_RCM_scanfire:rw"

    entrypoint: [ "python", "/app/scanfire_modules/pipeline/orchestrator/segmentation_orchestrator.py" ]
    deploy:
      <<: *gpu-deploy

  # === Model Benchmark Orchestrator (dev plan docs/dev-plans/2026-10-08_model_benchmark_predict.md) ===
  # Profile "benchmark": NEVER started by `make up` / `orchestrator-start`.
  # Single pass then exit (restart: "no"): every model of configs/benchmark/models.yaml
  # on the active model_benchmark test cases → <output_root>/<model>/<event_id>/*.tif.
  # GPU shared with event_detection_orchestrator (no special handling).
  # Launch: make benchmark-start [BENCHMARK_ARGS="--model X --test-case 3 --force"]
  model_benchmark_orchestrator:
    build:
      context: .
      dockerfile: orchestrator.Dockerfile
    runtime: nvidia
    shm_size: '32gb'
    container_name: model_benchmark_orchestrator
    profiles: [ "benchmark" ]
    restart: "no"
    user: '9005'
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - LOGGER_LEVEL=${LOGGER_LEVEL:-INFO}
      - BENCHMARK_MODELS_FILE=/app/configs/benchmark/models.yaml
      - BENCHMARK_CSV_DIR=${BENCHMARK_CSV_DIR:-/mnt/geospatial/projet_RCM_scanfire/benchmark_outputs/_csv}
      # empty ⇒ output_root of models.yaml
      - BENCHMARK_OUTPUT_DIR=${BENCHMARK_OUTPUT_DIR:-}
      # extra CLI args, interpolated from the host at `up` time (see Makefile)
      - BENCHMARK_ARGS=${BENCHMARK_ARGS:-}
    volumes:
      - "./configs:/app/configs:ro"
      - "./scripts:/app/scripts:ro"
      - "./models_checkpoints:/app/models_checkpoints:ro"
      - "../scanfire/scanfire_modules:/app/scanfire_modules:ro"
      - "/mnt/geospatial/projet_RCM_scanfire:/mnt/geospatial/projet_RCM_scanfire:rw"
    # BENCHMARK_ARGS (env, `up`) + "$@" (args of `docker compose run … <args>`)
    entrypoint:
      - sh
      - -c
      - exec python /app/scanfire_modules/pipeline/orchestrator/model_benchmark_orchestrator.py $${BENCHMARK_ARGS:-} "$$@"
      - model_benchmark_orchestrator
    deploy:
      <<: *gpu-deploy
